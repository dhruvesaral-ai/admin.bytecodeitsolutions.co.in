name: Deploy Bytecode Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            export NVM_DIR="/root/.nvm"
            export PATH="/root/.nvm/versions/node/v24.21.0/bin:/usr/local/bin:/usr/bin:/bin"

            cd /var/www/admin.bytecodeitsolutions.co.in

            node -v
            yarn -v
            pm2 -v

            git pull --ff-only origin main
            yarn install --frozen-lockfile
            yarn prisma generate
            yarn prisma migrate deploy
            yarn build
            pm2 restart admin.bytecodeitsolutions --update-env
